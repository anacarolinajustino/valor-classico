# ATENÇÃO (2026-07-09): este arquivo NÃO está sincronizado com o serviço real
# no Render (foi criado manualmente pelo painel, não via blueprint). Mudar
# aqui não muda produção — precisa editar direto em Settings > Build & Deploy
# no painel, ou via API. Corrigido aqui só pra documentar o estado correto
# (buildCommand estava sem o passo de instalar o Chromium, então nenhum
# conector com Playwright funcionava em produção).
services:
  - type: web
    name: valor-classico
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt && python -m playwright install --with-deps chromium
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 300
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: valor-classico-db
          property: connectionString

databases:
  - name: valor-classico-db
    plan: free
    region: frankfurt
