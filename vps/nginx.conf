# Configuração Nginx para Valor Clássico
# Substitua SEUDOMINIO.com.br pelo domínio real antes de usar.
#
# Instalar:
#   sudo cp hostinger/nginx.conf /etc/nginx/sites-available/valor-classico
#   sudo ln -s /etc/nginx/sites-available/valor-classico /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Habilitar SSL (depois do site estar no ar via HTTP):
#   sudo certbot --nginx -d SEUDOMINIO.com.br -d www.SEUDOMINIO.com.br

server {
    listen 80;
    server_name SEUDOMINIO.com.br www.SEUDOMINIO.com.br;

    # Arquivos estáticos servidos diretamente pelo Nginx (mais rápido que Flask)
    location /static/ {
        alias /var/www/valor-classico/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        gzip_static on;
    }

    # Todo o resto vai para o Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }

    # Tamanho máximo de upload (se necessário no futuro)
    client_max_body_size 10M;

    access_log /var/log/nginx/valor-classico-access.log;
    error_log  /var/log/nginx/valor-classico-error.log;
}
